#:schema https://mise.jdx.dev/schema/mise.json
# mise - Development Environment Setup Tool
# https://mise.jdx.dev/

[tools]
# runtime
node = "24.19.0"
pnpm = "11.21.0"
# maintenance
pinact = "4.1.1"
# lint
# Pinned to the same aqua packages as the sibling rsdebstrap repository. The
# explicit `aqua:` backend keeps the package identity stable even if the mise
# registry later remaps a short name to a different source.
"aqua:reviewdog/reviewdog" = "0.21.0"
"aqua:editorconfig-checker/editorconfig-checker" = "3.11.1"
"aqua:rhysd/actionlint" = "1.7.12"
# A reviewdog runner of its own over scripts/, and consumed by
# `actionlint -shellcheck shellcheck` to lint workflow `run:` blocks.
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:zizmorcore/zizmor" = "1.29.0"
"aqua:jqlang/jq" = "1.8.2"

[settings]
lockfile = true

################################################################################
# Setup
################################################################################

[tasks.setup]
description = "Install node dependencies"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.modules.yaml"]
run = "pnpm install --frozen-lockfile"

################################################################################
# Format / generate
################################################################################

[tasks."format:pinact"]
description = "Pin GitHub Actions to full-length commit SHAs"
run = "pinact run"

[tasks."format:oxfmt"]
description = "Format sources with oxfmt"
depends = ["setup"]
run = "pnpm format"

# Sequential on purpose: `depends` runs in parallel, and pinact rewrites the same
# .github/**/*.yml files that oxfmt reformats. pinact must land first so oxfmt
# normalises the SHAs it wrote.
[tasks.format]
description = "Run every formatter"
run = [{ task = "format:pinact" }, { task = "format:oxfmt" }]

[tasks.typegen]
description = "Generate worker-configuration.d.ts from wrangler.jsonc"
depends = ["setup"]
run = "pnpm typegen"

# Deliberately not named `lint:fix`: the reviewdog runners live under the
# `reviewdog:` namespace, and a `lint:` namespace here would be matched by any
# future `lint:*` glob and pull an autofixer into a read-only gate.
[tasks.lint-fix]
description = "Apply oxlint autofixes"
depends = ["setup"]
run = "pnpm lint:fix"

################################################################################
# Verify
################################################################################

[tasks.typecheck]
description = "Type-check src and test"
depends = ["setup"]
run = "pnpm typecheck"

[tasks.test]
description = "Run the test suite"
depends = ["setup"]
run = "pnpm test"

[tasks.build]
description = "Bundle the worker without deploying"
depends = ["setup"]
run = "pnpm build"

################################################################################
# Worker
################################################################################

[tasks.dev]
description = "Run the worker locally with wrangler dev"
depends = ["setup"]
run = "pnpm dev"

# `pnpm run deploy`, not `pnpm deploy`: pnpm has a built-in `deploy` command that
# takes precedence over the script and swallows the arguments meant for wrangler.
[tasks.deploy]
description = "Deploy the worker to Cloudflare"
depends = ["setup"]
run = "pnpm run deploy"

# The escape hatch for the wrangler subcommands that have no script of their own
# (`login`, `secret put`, `tail`, `delete`). mise appends the task's CLI arguments
# to the run command, so `mise run wrangler secret put NAME` reaches wrangler
# intact. Separate flags with `--` -- `mise run wrangler -- delete --help` --
# because mise claims some of them (`--help`) for itself otherwise.
[tasks.wrangler]
description = "Run wrangler directly (login, secret put, tail, ...)"
depends = ["setup"]
run = "pnpm exec wrangler"

################################################################################
# Reviewdog
################################################################################

# The lint gate lives here and only here: -filter-mode nofilter lints the whole
# tree rather than only changed lines, and -fail-level any turns any finding into
# a non-zero exit. CI appends to REVIEWDOG_ARGS, so it can add debug output but
# cannot drop the gate. REVIEWDOG_REPORTER is read from the environment rather
# than declared in a task `env` table, which would shadow the value CI exports.
[tasks.reviewdog-run]
description = "Internal: run a single reviewdog runner"
hide = true
run = 'reviewdog -runners "${REVIEWDOG_RUNNER}" -reporter "${REVIEWDOG_REPORTER:-local}" -filter-mode nofilter -log-level warning -fail-level any ${REVIEWDOG_ARGS:-}'

[tasks."reviewdog:oxlint"]
description = "reviewdog: oxlint"
depends = ["setup"]
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "oxlint" } }]

[tasks."reviewdog:editorconfig-checker"]
description = "reviewdog: editorconfig-checker"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "editorconfig-checker" } }]

[tasks."reviewdog:actionlint"]
description = "reviewdog: actionlint"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "actionlint" } }]

[tasks."reviewdog:shellcheck"]
description = "reviewdog: shellcheck"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "shellcheck" } }]

# No `depends = ["setup"]`: the check is a shell script over tracked files, so
# the matrix marks the shard as needing no node_modules.
[tasks."reviewdog:file-refs"]
description = "reviewdog: comment file references"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "file-refs" } }]

[tasks."reviewdog:ghalint-run"]
description = "reviewdog: ghalint run"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "ghalint-run" } }]

[tasks."reviewdog:ghalint-act"]
description = "reviewdog: ghalint act"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "ghalint-act" } }]

[tasks."reviewdog:zizmor"]
description = "reviewdog: zizmor"
run = [{ task = "reviewdog-run", env = { REVIEWDOG_RUNNER = "zizmor" } }]

[tasks.reviewdog]
description = "Run every reviewdog runner"
depends = ["reviewdog:*"]

# Named outside the `reviewdog:` namespace on purpose. `hide = true` would keep
# this out of `mise tasks ls --json`, but it would NOT keep it out of
# `depends = ["reviewdog:*"]`, so it would still run as part of the lint gate.
# `output = "quiet"` suppresses mise's per-task label prefix so stdout is pure
# JSON and can be captured straight into $GITHUB_OUTPUT.
#
# `pnpm-install` tells CI whether the shard needs node_modules, derived from the
# task's own `depends` rather than a second list in the workflow. The `error`
# guard is there because a silent `false` everywhere would still go green -- the
# shard would just install uncached inside the task -- and quietly undo the pnpm
# store cache the moment mise renames the field.
[tasks.reviewdog-matrix]
description = "Emit the reviewdog runner matrix as JSON for CI"
output = "quiet"
run = '''
mise tasks ls --json | jq -cM '
  [.[]
    | select(.name | startswith("reviewdog:"))
    | {
        name: (.name | split(":") | last),
        target: .name,
        "pnpm-install": ((((.depends // []) | flatten | index("setup")) != null) | tostring),
      }
  ]
  | if any(.[]; .["pnpm-install"] == "true")
    then {include: .}
    else error("no reviewdog task depends on setup; mise tasks ls --json shape changed")
    end
'
'''

################################################################################
# Aggregate
################################################################################

# `run` rather than `depends`, because `depends` runs its entries in parallel and
# the formatters rewrite files the linters read.
[tasks.default]
description = "Run every CI gate locally, sequentially"
alias = "all"
run = [
  { task = "format" },
  { task = "typegen" },
  { task = "reviewdog" },
  { task = "typecheck" },
  { task = "test" },
  { task = "build" },
]
