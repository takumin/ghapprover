---
name: Setup
description: Install the mise toolchain, and optionally the node dependencies with a cached pnpm store
inputs:
  mise-install-locked:
    description: Install the mise tools with `--locked`, failing on a tool that mise.lock does not pin
    required: false
    default: "true"
  pnpm-install:
    description: Install the node dependencies, with the pnpm store restored from cache
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: ${{ inputs.mise-install-locked }}
        cache_save: ${{ github.ref == 'refs/heads/main' }}
    # Not optional: mise-action's `install` *is* the locked install, so turning it
    # off leaves the tools uninstalled rather than installed loosely.
    - name: Install tools
      if: inputs.mise-install-locked != 'true'
      shell: bash
      run: mise install
    # Asked for rather than hardcoded: the store directory is versioned by store
    # format, not by pnpm release, and is relocatable through pnpm config.
    - name: Resolve pnpm store path
      if: inputs.pnpm-install == 'true'
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    # The key mirrors the `sources` of the mise `setup` task, so the cache is
    # invalidated by exactly the files that make a reinstall necessary. The
    # prefix fallback still hands back main's store on a lockfile bump, leaving
    # pnpm to fetch only the packages that actually changed.
    #
    # Split from the save below, rather than one `actions/cache`, because the save
    # has to run after the install and a composite action cannot declare a `post`
    # step to hold it.
    - name: Restore pnpm store
      if: inputs.pnpm-install == 'true'
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    # Installing here rather than leaving it to each task's `depends = ["setup"]`
    # keeps the install between the restore and the save steps below.
    - name: Install node dependencies
      if: inputs.pnpm-install == 'true'
      shell: bash
      run: mise run setup
    # A prefix-key restore carries every package version the store ever held, so
    # without a prune the saved archive only grows.
    - name: Prune pnpm store
      if: inputs.pnpm-install == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune
    # Saved on main only, matching mise-action's `cache_save`: a cache written
    # from a pull request is scoped to that branch, so it is evicted unused while
    # still eating into the repository's 10 GB budget.
    - name: Save pnpm store
      if: inputs.pnpm-install == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
