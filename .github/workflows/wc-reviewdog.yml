---
name: Reviewdog
on:
  workflow_call:
permissions: {}
concurrency:
  group: reviewdog-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ##############################################################################
  # Matrix
  ##############################################################################
  # The runner list is derived from the `reviewdog:*` tasks in mise.toml rather
  # than duplicated here, so adding a linter is a one-line task change.
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate Matrix
        id: matrix
        run: echo "result=$(mise run reviewdog-matrix)" >> "$GITHUB_OUTPUT"
      - name: Check Matrix
        env:
          REVIEWDOG_MATRIX: ${{ steps.matrix.outputs.result }}
        run: echo "${REVIEWDOG_MATRIX}" | jq
  ##############################################################################
  # Runner
  ##############################################################################
  reviewdog:
    needs: matrix
    name: Reviewdog (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.targets) }}
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Running reviewdog
        env:
          REVIEWDOG_TARGET: ${{ matrix.target }}
          REVIEWDOG_REPORTER: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Appended to the task's own flags, which carry the -fail-level and
          # -filter-mode lint gate; these only add CI debug output.
          REVIEWDOG_ARGS: -log-level debug -tee
        run: mise run "${REVIEWDOG_TARGET}"
