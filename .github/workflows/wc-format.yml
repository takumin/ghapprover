---
name: Format
on:
  workflow_call:
permissions: {}
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Format files
        env:
          # pinact resolves action tags to commit SHAs through the GitHub API and
          # hits the unauthenticated rate limit without a token.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run format
      - name: Generate worker types
        run: mise run typegen
      - name: Detected changes
        run: |-
          git reset
          git -c core.fileMode=false add --all
          git diff --name-only --staged --no-renames --exit-code
