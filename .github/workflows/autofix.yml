---
name: autofix.ci
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  autofix:
    name: autofix.ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `mise-install: false` because the install must be allowed to extend
      # mise.lock. mise-action would otherwise run `mise install --locked`, which
      # fails outright when a tool in mise.toml has no lockfile entry yet. Every
      # other workflow keeps the strict locked install; this job is the one place
      # that regenerates the lockfile, and autofix commits the result.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          mise-install: "false"
      - name: Fix lint
        run: mise run lint-fix
      - name: Generate worker types
        run: mise run typegen
      # Last of the fixers: `oxlint --fix` can emit unformatted code, so the
      # formatter has to see its output.
      - name: Format files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run format
      - name: Autofix
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
